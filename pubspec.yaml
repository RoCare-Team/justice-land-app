name: flutter_legal_care
description: Justiceland — mobile client for the Justiceland lawyer platform.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Material's adaptive widgets (Switch.adaptive, SwitchListTile.adaptive) reach
  # for Cupertino glyphs, and without the font the release build warns and those
  # icons render as empty boxes.
  cupertino_icons: ^1.0.8

  # ── Networking ───────────────────────────────────────────────────────────
  # The web app authenticates with an httpOnly cookie (lci_token). Dio plus a
  # persisted cookie jar reproduces that exactly: the server keeps issuing the
  # same cookie and the app never has to see the token.
  dio: ^5.4.3+1
  cookie_jar: ^4.0.8
  dio_cookie_manager: ^3.1.1
  path_provider: ^2.1.3

  # ── State + routing ──────────────────────────────────────────────────────
  provider: ^6.1.2
  go_router: ^14.2.0

  # ── Storage ──────────────────────────────────────────────────────────────
  shared_preferences: ^2.2.3

  # ── Payments (wallet top-up, same Razorpay account as the web app) ───────
  razorpay_flutter: ^1.3.7

  # ── Live consultations ───────────────────────────────────────────────────
  # Video calls use the same WebRTC handshake as the web client, signalled
  # through /api/consultations/<id>/call.
  # 0.11.x still registers through PluginRegistry.Registrar, the v1 Android
  # embedding Flutter has since removed — its Java sources no longer compile.
  flutter_webrtc: ^1.0.0
  permission_handler: ^11.3.1

  # ── Location (city detection + "lawyers near me" distance filter) ────────
  geolocator: ^12.0.0

  # ── UI ───────────────────────────────────────────────────────────────────
  cached_network_image: ^3.3.1
  intl: ^0.19.0
  url_launcher: ^6.3.0
  image_picker: ^1.1.2
  # Bar Council certificate and ID proof uploads accept PDFs, which the image
  # picker cannot choose.
  file_picker: ^10.1.9
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Used only by test/router_test.dart, to stand in for the platform channels
  # the router's dependencies would otherwise reach for.
  path_provider_platform_interface: ^2.1.2
  plugin_platform_interface: ^2.1.8
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/

# Launcher icons, generated with `dart run flutter_launcher_icons`.
#
# The mark is the navy book and gold scales the brand uses everywhere else. The
# adaptive foreground is the same artwork inset further, because Android masks
# the icon to a circle or a squircle and the unpadded version loses the outer
# edges of the book to that mask.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/app_icon.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/icon/app_icon_foreground.png
  remove_alpha_ios: true
