name: flutter_legal_care
description: Justiceland — mobile client for the Justiceland lawyer platform.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # ── Networking ───────────────────────────────────────────────────────────
  # The web app authenticates with an httpOnly cookie (lci_token). Dio plus a
  # persisted cookie jar reproduces that exactly: the server keeps issuing the
  # same cookie and the app never has to see the token.
  dio: ^5.4.3+1
  cookie_jar: ^4.0.8
  dio_cookie_manager: ^3.1.1
  path_provider: ^2.1.3

  # ── State + routing ──────────────────────────────────────────────────────
  provider: ^6.1.2
  go_router: ^14.2.0

  # ── Storage ──────────────────────────────────────────────────────────────
  shared_preferences: ^2.2.3

  # ── Payments (wallet top-up, same Razorpay account as the web app) ───────
  razorpay_flutter: ^1.3.7

  # ── Live consultations ───────────────────────────────────────────────────
  # Video calls use the same WebRTC handshake as the web client, signalled
  # through /api/consultations/<id>/call.
  flutter_webrtc: ^0.11.7
  permission_handler: ^11.3.1

  # ── Location (city detection + "lawyers near me" distance filter) ────────
  geolocator: ^12.0.0

  # ── UI ───────────────────────────────────────────────────────────────────
  cached_network_image: ^3.3.1
  intl: ^0.19.0
  url_launcher: ^6.3.0
  image_picker: ^1.1.2
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
